<!DOCTYPE html>
<html>
<head>
    <title>Add Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f8fafc, #eef2ff); min-height: 100vh; font-family: Arial, sans-serif; }
        .card-soft { border: none; border-radius: 20px; box-shadow: 0 14px 34px rgba(15, 23, 42, 0.12); }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-soft">
                <div class="card-body p-4 p-md-5">
                    <h2 class="fw-bold mb-2">Add a Review</h2>
                    <p class="text-muted mb-4">Choose an app and share your feedback so the rating can be analyzed.</p>
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            <div class="alert alert-success">{{ messages[0] }}</div>
                        {% endif %}
                    {% endwith %}
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Select App</label>
                            <select name="app_id" class="form-select" required>
                                {% for app in apps %}
                                <option value="{{ app[0] }}">{{ app[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Review Comment</label>
                            <textarea name="review" class="form-control" rows="6" placeholder="Write your review here..." required></textarea>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button class="btn btn-success">Submit Review</button>
                            <a href="/dashboard" class="btn btn-outline-secondary">Back to Dashboard</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
