{% extends "base.html" %}
{% block title %}Add Review{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="page-header">
                <h2>Add a Review</h2>
                <p class="mb-0">Choose an app and share your feedback so the rating can be analyzed.</p>
            </div>
            <div class="card card-flat">
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Select App</label>
                            <select name="app_id" class="form-select" required>
                                {% for app in apps %}
                                <option value="{{ app[0] }}">{{ app[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Review Comment</label>
                            <textarea name="review" class="form-control" rows="6" placeholder="Write your review here..." required></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-primary"><i class="bi bi-send me-1"></i>Submit Review</button>
                            <a href="/dashboard" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
