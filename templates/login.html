{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container">
    <div class="auth-shell">
        <div class="card card-flat" style="width: 100%; max-width: 420px;">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock" style="font-size: 2rem; color: var(--primary);"></i>
                    <h3 class="fw-bold mt-2 mb-1">Welcome back</h3>
                    <p class="text-muted mb-0">Login to continue</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                    <button class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-4 mb-0 text-muted">
                    New here? <a href="/register">Create an account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
