<!DOCTYPE html>
<html>
<head>
    <title>Image Check</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fef3c7, #f8fafc);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .card-soft {
            border: none;
            border-radius: 20px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, 0.12);
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card card-soft">
                <div class="card-body p-4 p-md-5 text-center">
                    <h2 class="fw-bold mb-2">Image Verification</h2>
                    <p class="text-muted mb-4">Upload an app screenshot to check whether it matches known sample app images.</p>
                    <form method="POST" enctype="multipart/form-data">
                        <input type="file" name="image" class="form-control" required>
                        <button class="btn btn-dark mt-3">Check Image</button>
                    </form>
                    {% if result %}
                    <div class="alert {% if 'REAL' in result %}alert-success{% else %}alert-warning{% endif %} mt-4 mb-0">{{result}}</div>
                    {% endif %}
                    <a href="/dashboard" class="btn btn-outline-secondary mt-4">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
