{% extends "base.html" %}
{% block title %}Add Application{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="page-header">
                <h2>Add New App Record</h2>
                <p class="mb-0">The review below is run through the sentiment engine automatically to seed the app's initial rating.</p>
            </div>
            <div class="card card-flat">
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">App Name</label>
                                <input type="text" name="name" class="form-control" placeholder="Enter app name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Category</label>
                                <input type="text" name="category" class="form-control" placeholder="Enter category" required>
                            </div>
                        </div>
                        <div class="mb-3 mt-3">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Short app description"></textarea>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Download Link</label>
                                <input type="text" name="link" class="form-control" placeholder="https://example.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Image URL</label>
                                <input type="text" name="image_url" class="form-control" placeholder="https://image-url.com/app.png">
                            </div>
                        </div>
                        <div class="mb-4 mt-3">
                            <label class="form-label">Review</label>
                            <textarea name="review" class="form-control" rows="5" placeholder="Write a review such as good, bad, fake, scam, or excellent" required></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-magic me-1"></i>Analyze &amp; Add App</button>
                            <a href="/admin/dashboard" class="btn btn-outline-secondary">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
