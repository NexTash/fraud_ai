<!DOCTYPE html>
<html>
<head>
    <title>Add Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc, #e0f2fe);
            min-height: 100vh;
        }
        .card-soft {
            border: none;
            border-radius: 20px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, 0.12);
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card card-soft">
                <div class="card-body p-4 p-md-5">
                    <h2 class="fw-bold mb-2">Add New App Record</h2>
                    <p class="text-muted mb-4">Submit an app review for the admin dashboard so it can be analyzed and displayed clearly.</p>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">App Name</label>
                            <input type="text" name="name" class="form-control" placeholder="Enter app name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" name="category" class="form-control" placeholder="Enter category" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Short app description"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Download Link</label>
                            <input type="text" name="link" class="form-control" placeholder="https://example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="text" name="image_url" class="form-control" placeholder="https://image-url.com/app.png">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Review</label>
                            <textarea name="review" class="form-control" rows="5" placeholder="Write a review such as good, bad, fake, scam, or excellent" required></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Analyze & Add App</button>
                            <a href="/admin/dashboard" class="btn btn-outline-secondary">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
